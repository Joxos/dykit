name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Validate PyPI token secret
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_API_TOKEN" ]; then
            echo "❌ Missing secret: PYPI_API_TOKEN"
            echo "Create a user-scoped PyPI API token and save it as repository secret PYPI_API_TOKEN."
            exit 1
          fi

      - name: Skip if this version is already published
        id: exists
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import tomllib
          import urllib.error
          import urllib.request

          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          try:
              with urllib.request.urlopen("https://pypi.org/pypi/dykit/json", timeout=20) as r:
                  data = json.load(r)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  data = {"releases": {}}
              else:
                  raise
          print(f"version={version}")
          print(f"exists={'true' if version in data.get('releases', {}) else 'false'}")
          PY

      - name: Build distributions
        if: steps.exists.outputs.exists != 'true'
        run: python -m build --outdir dist .

      - name: Create helper scripts
        if: steps.exists.outputs.exists != 'true'
        run: |
          mkdir -p .github/scripts
          cat > .github/scripts/wait_pypi.py <<'PY'
          from __future__ import annotations

          import json
          import sys
          import time
          import urllib.request

          version = sys.argv[1]

          for delay in (5, 10, 20, 40, 60, 120):
              try:
                  with urllib.request.urlopen("https://pypi.org/pypi/dykit/json", timeout=20) as r:
                      data = json.load(r)
                  if version in data.get("releases", {}):
                      print(f"dykit=={version} is visible on PyPI")
                      sys.exit(0)
              except Exception as exc:  # noqa: BLE001
                  print(f"PyPI check failed: {exc}")

              print(f"dykit=={version} not visible yet; sleeping {delay}s")
              time.sleep(delay)

          print(f"timed out waiting for dykit=={version} on PyPI")
          sys.exit(1)
          PY

      - name: Validate metadata
        if: steps.exists.outputs.exists != 'true'
        run: python -m twine check dist/*

      - name: Publish to PyPI
        if: steps.exists.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: false
          verbose: true
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Wait for PyPI visibility
        if: steps.exists.outputs.exists != 'true'
        run: python .github/scripts/wait_pypi.py "$VERSION"
        env:
          VERSION: ${{ steps.exists.outputs.version }}
