name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --dev

      - name: Validate cache artifacts are not committed
        run: |
          if git ls-files | grep -E '(^|/)__pycache__/|\.pyc$'; then
            echo "Found forbidden cache artifacts tracked in git"
            exit 1
          fi

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check --diff .

      - name: Type check
        run: uv run basedpyright

      - name: Public type completeness (PEP 561)
        run: uv run basedpyright --verifytypes dykit --ignoreexternal

      - name: Dead code
        run: uv run vulture src/dykit scripts --min-confidence 80

      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --dev

      - name: Build distributions
        run: uv build --out-dir dist

      - name: Validate wheel and sdist
        run: uv run twine check dist/*.whl dist/*.tar.gz
