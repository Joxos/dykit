[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dykit"
version = "6.0.0"
description = "Douyu danmu capture and analysis - one package, a pure protocol codec, room/server discovery, live collection into per-run SQLite files, and offline stats over them."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Douyu Danmu Crawler Project", email = "contact@example.com" }
]
keywords = ["douyu", "danmu", "chat", "websocket", "collector", "sqlite", "statistics"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Database",
]
dependencies = [
    # protocol: construct is the only packet codec dependency
    "construct>=2.10.70",
    # source: the only modules that talk HTTP to douyu.com
    "httpx>=0.28.1",
    "beautifulsoup4>=4.14.3",
    # shared
    "tenacity>=9.1.2",
    # collect
    "websockets>=12.0",
    # presentation + CLI (both commands)
    "cyclopts",
    "rich>=14.0.0",
    "loguru>=0.7.0",
    # stats
    "rapidfuzz>=3.14.1",
]

[project.scripts]
dykit-capture = "dykit.collect.cli:main"
dykit-stats = "dykit.stats.cli:main"

[project.urls]
Homepage = "https://github.com/Joxos/dykit"
Repository = "https://github.com/Joxos/dykit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dykit = ["py.typed"]

# ---------------------------------------------------------------------------
# Tooling lives here only - there is exactly one source of truth for
# lint/format/type/test settings.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["typings"]

[tool.ruff.format]
# Keep the existing quote style (SQL literals read better with single quotes);
# everything else follows ruff's formatter defaults.
quote-style = "preserve"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade - modern stdlib/target idioms
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "PERF", # perflint
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific rules
    "FURB", # refurb
    "ISC",  # flake8-implicit-str-concat
]
ignore = [
    # Line length is the formatter's job; long strings/comments stay legal.
    "E501",
    # Ambiguous-unicode rules: CJK punctuation is intentional in user-facing text.
    "RUF001",
    "RUF002",
    "RUF003",
    # `class MessageType(str, Enum)` -> StrEnum would change `str()` output of the
    # public API. Revisit at dykit 7.0.
    "UP042",
]

[tool.ruff.lint.isort]
known-first-party = ["dykit"]

[tool.ruff.lint.per-file-ignores]
# This `__all__` is grouped by section with explanatory comments, which is more
# useful for a public API than an alphabetical list.
"src/dykit/__init__.py" = ["RUF022"]
"src/dykit/protocol/__init__.py" = ["RUF022"]

[tool.basedpyright]
# Covers every tracked Python file: the package, the scripts, the tests.
include = ["src", "scripts", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
stubPath = "typings"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
    "smoke: real SQLite run-file smoke tests",
]

[tool.coverage.run]
source = ["src/dykit"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Ratchet floor: measured 77% today. Raise it as coverage grows; never lower it.
fail_under = 72
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "basedpyright>=1.40.2",
    "vulture>=2.11",
    "pytest>=8.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=5.0",
    "build>=1.2",
    "twine>=6.1",
    "pre-commit>=4.7.0",
]
